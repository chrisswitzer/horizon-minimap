[mod]
id = "paper_minimap"
version = "0.2.0"
priority = 100

# Targets the installed Nightly; full integration build still required.
# World geometry and terrain access are version-sensitive.
[compatibility]
horizon_revision = "fdc87aecdbd116bf1e08adcd062fcbaea8c2e2ca"

[[module]]
id = "core"
file = "crates/horizon-client/src/game.rs"
name = "paper_minimap"
source = "runtime.rs"

[[module]]
id = "ui"
file = "crates/horizon-client/src/game.rs"
name = "paper_map_ui"
source = "adapter.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_tick_post"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "key"
