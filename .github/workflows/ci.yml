name: Core tests and source bundle
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Test map behavior
        run: cargo +stable test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and package source
        run: python check_bundle.py --package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: paper-minimap-source
          path: dist/*.hnmod
